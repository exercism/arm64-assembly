name: arm64-assembly / main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
          - os: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install cross compiler and QEMU if not running on ARM64
        if: ${{ runner.arch != 'ARM64' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu

      - name: Run exercism/arm64-assembly CI (runs tests) for all exercises
        run: make -j $(nproc)

  tests:
    name: Tests
    needs: ci
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check that every configuration passed
        env:
          RESULT: ${{ needs.ci.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "The exercise tests failed on at least one configuration."
            exit 1
          fi
